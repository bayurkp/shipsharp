services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shipsharp-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=ShipSharp@Password2026!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data

volumes:
  mssql_data:
